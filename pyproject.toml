[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jariodon-longctx_jd118"
version = "0.1.0"
description = "用一组明示的正则规则扫描输入，报告长上下文优化工程师·混合精度的溢出与下溢相关的命中行与片段"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "jariodon" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://jariodon.github.io"
Repository = "https://github.com/jariodon/longctx_jd118"
Issues = "https://github.com/jariodon/longctx_jd118/issues"

[project.scripts]
longctx_jd118 = "longctx_jd118:main"

[tool.setuptools]
py-modules = ["longctx_jd118"]
